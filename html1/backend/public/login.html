<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

        background-image: url("https://img.freepik.com/premium-photo/full-table-italian-meals-plates-pizza-pasta-ravioli_118124-229382.jpg");
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
    }

    /* Glass login box */
    .login-box {
        width: 450px;
        padding: 40px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        text-align: center;
    }

    .login-box h2 {
        font-size: 2em;
        margin-bottom: 25px;
        color: white;
        font-weight: 600;
    }

    input {
        width: 100%;
        padding: 14px;
        border-radius: 10px;
        margin-bottom: 18px;
        border: none;
        font-size: 1em;
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #ff6347;
        color: white;
        font-size: 1.1em;
        cursor: pointer;
        font-weight: 600;
    }

    button:hover {
        background: #ff2a00;
        transform: scale(1.02);
    }

</style>
</head>

<body>

<div class="login-box">
    <h2>Admin Login</h2>

    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>

    <button onclick="login()">Login</button>
</div>

<script>
async function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!email || !password) {
        alert("Please enter both email and password");
        return;
    }

    try {
        const res = await fetch("http://localhost:5002/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        alert(data.message);

        if (data.success) {
            window.location.href = "admin.html";
        }

    } catch (err) {
        console.error(err);
        alert("Server not responding. Start backend first!");
    }
}
</script>


</body>
</html>
