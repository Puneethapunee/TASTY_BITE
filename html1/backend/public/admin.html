<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tasty Bite - Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
    body {
        font-family: 'Poppins', sans-serif;
        background-image: url('https://images.unsplash.com/photo-1528715471579-d1bcf0ba5cfa');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        margin: 0;
        padding: 0;
    }

    header {
        background: #ff6347;
        color: white;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    header h1 {
        font-size: 1.8em;
    }

    button.logout {
        background: white;
        border: none;
        padding: 8px 15px;
        border-radius: 20px;
        cursor: pointer;
        color: #ff6347;
        font-weight: bold;
    }

    .container {
        padding: 30px;
    }

    .section-title {
        font-size: 1.8em;
        margin: 20px 0;
        color: #333;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 40px;
        background: #fff;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    th, td {
        padding: 12px 15px;
        border-bottom: 1px solid #eee;
        text-align: left;
    }

    th {
        background: #ff6347;
        color: white;
        font-size: 1.1em;
    }

    tr:hover {
        background: #fce5e1;
    }
</style>
</head>

<body>

<header>
    <h1>Admin Dashboard</h1>
    <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

    <h2 class="section-title">Orders</h2>
    <table id="ordersTable">
        <thead>
            <tr>
                <th>Customer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <h2 class="section-title">Contact Messages</h2>
    <table id="messagesTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Message</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

</div>

<script>

/* ---------- ADMIN AUTH CHECK ---------- */
async function checkAdmin() {
    const res = await fetch("/api/admin/check", {
        credentials: "include"
    });
    const data = await res.json();

    if (!data.loggedIn) {
        alert("Access Denied. Please Login First.");
        window.location.href = "/login.html";
    }
}
checkAdmin();

/* ---------- LOGOUT ---------- */
async function logout() {
    await fetch("/api/admin/logout", {
        credentials: "include"
    });
    alert("Logged out successfully");
    window.location.href = "/login.html";
}

/* ---------- LOAD ORDERS ---------- */
async function loadOrders() {
    const res = await fetch("/api/orders", {
        credentials: "include"
    });
    const orders = await res.json();

    const table = document.querySelector("#ordersTable tbody");
    table.innerHTML = "";

    if (orders.length === 0) {
        table.innerHTML = `<tr><td colspan="4">No orders found</td></tr>`;
        return;
    }

    orders.forEach(order => {
        const row = `
            <tr>
                <td>${order.customerName || "Guest"}</td>
                <td>${order.items.map(i => i.name).join(", ")}</td>
                <td>₹${order.total}</td>
                <td>${new Date(order.createdAt).toLocaleString()}</td>
            </tr>
        `;
        table.innerHTML += row;
    });
}

/* ---------- LOAD CONTACT MESSAGES ---------- */
async function loadMessages() {
    const res = await fetch("/api/contact", {
        credentials: "include"
    });
    const messages = await res.json();

    const table = document.querySelector("#messagesTable tbody");
    table.innerHTML = "";

    if (messages.length === 0) {
        table.innerHTML = `<tr><td colspan="4">No messages found</td></tr>`;
        return;
    }

    messages.forEach(msg => {
        const row = `
            <tr>
                <td>${msg.name}</td>
                <td>${msg.email}</td>
                <td>${msg.message}</td>
                <td>${new Date(msg.createdAt).toLocaleString()}</td>
            </tr>
        `;
        table.innerHTML += row;
    });
}

loadOrders();
loadMessages();

</script>

</body>
</html>
